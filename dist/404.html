<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f4eee3"><title>Страница не найдена · Крошка</title><style>*{box-sizing:border-box}body{margin:0;background:#f4eee3;color:#352b23;font-family:Manrope,sans-serif;text-align:center;min-height:100dvh;display:grid;place-items:center;padding:24px}main{max-width:680px}p{font-size:16px;line-height:24px;color:#75685b;text-wrap:pretty}h1{font-size:48px;line-height:1;font-weight:500;letter-spacing:-.05em;text-wrap:balance;margin:32px 0}small{font-size:12px;line-height:16px;letter-spacing:.1em;text-transform:uppercase}a{display:inline-flex;background:#a74126;color:#faf6ee;padding:12px 16px;border-radius:8px;text-decoration:none;font-size:16px;line-height:24px;margin-top:24px}a:focus-visible{outline:3px solid #a74126;outline-offset:4px}.brand{color:#a74126;font-size:60px;line-height:1;margin-bottom:32px}</style></head><body><main><img id="error-logo" width="96" height="96" alt="" style="display:block;margin:0 auto 32px"><small>Крошка · 404</small><h1>Страница не найдена.</h1><p>Проверьте адрес или вернитесь на главную.</p><a id="home-link" href="./index.html">На главную ↗</a></main><script>const pieces=location.pathname.split('/').filter(Boolean);const base=location.hostname.endsWith('.github.io')&&pieces.length?'/'+pieces[0]+'/':'/';document.getElementById('home-link').href=base+'index.html';document.getElementById('error-logo').src=base+'assets/kroshka-mark-web-v2.png';const font=new FontFace('Manrope','url('+base+'assets/manrope-400.ttf)');font.load().then(f=>document.fonts.add(f)).catch(()=>{});</script></body></html>
